# ОБЩИЙ РЕЖИМ ДЛЯ РАЗНЫХ ПОЛЬЗОВАТЕЛЕЙ:
# здесь лежат основные ручки, которые можно менять без правки Java-кода.

# Явный тип набора данных:
# auto = старое автоопределение по пути
# hf   = принудительно Hf
# zr   = принудительно Zr
dataset_mode=hf

# КЛЮЧЕВОЙ ПОРОГ: минимальный абсолютный размер колонии в пикселях.
min_colony_area=14

# Дополнительные важные ручки сегментации.
min_area_scale_scan=0.76
min_area_scale_photo=0.55
well_crop_scale=1.28
scan_threshold_factor=0.95
scan_roi_left_fraction=0.52
scan_roi_top_fraction=0.26

# По каким полям из well_counts.csv усреднять лунки внутри одной пластины.
# Для CDI-режима safest вариант — concentration.
summary_group_fields=concentration
